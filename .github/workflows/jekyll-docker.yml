name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Check project files
        run: |
          echo "Checking repository files..."
          pwd
          ls -la
          test -f index.html

      - name: Create package.json
        run: |
          cat > package.json <<'EOF'
          {
            "name": "al-juman-lab",
            "version": "1.0.0",
            "private": true,
            "description": "Al-Juman Al-Janabi Laboratory Management App",
            "scripts": {
              "build": "echo Web app ready"
            },
            "dependencies": {
              "@capacitor/core": "^7.0.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^7.0.0",
              "@capacitor/android": "^7.0.0"
            }
          }
          EOF

      - name: Install dependencies
        run: npm install

      - name: Prepare web files
        run: |
          mkdir -p www

          cp index.html www/index.html

          for file in app.js database.js patients.js reports.js tests.js settings.js statistics.js backup.js service-worker.js manifest.json style.css; do
            if [ -f "$file" ]; then
              cp "$file" www/
            fi
          done

      - name: Create Capacitor configuration
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.aljuman.lab",
            "appName": "Al-Juman Laboratory",
            "webDir": "www"
          }
          EOF

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Al-Juman-Laboratory-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
