name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create package.json
        run: |
          cat > package.json << 'EOF'
          {
            "name": "al-juman-lab",
            "version": "1.0.0",
            "private": true,
            "description": "Al-Juman Al-Janabi Laboratory App",
            "scripts": {
              "build": "echo Web app ready"
            }
          }
          EOF

      - name: Install Capacitor
        run: |
          npm install
          npm install @capacitor/core @capacitor/android
          npm install --save-dev @capacitor/cli

      - name: Prepare web files
        run: |
          mkdir -p www/css
          mkdir -p www/js

          cp index.html www/

          if [ -f style.css ]; then
            cp style.css www/css/style.css
          fi

          for file in app.js database.js tests.js patients.js reports.js statistics.js settings.js backup.js; do
            if [ -f "$file" ]; then
              cp "$file" www/js/
            fi
          done

          if [ -f manifest.json ]; then
            cp manifest.json www/
          fi

          if [ -f service-worker.js ]; then
            cp service-worker.js www/
          fi

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.aljuman.lab",
            "appName": "Al-Juman Laboratory",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Al-Juman-Laboratory-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
