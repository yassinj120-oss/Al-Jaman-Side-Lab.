name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
  uses: actions/setup-java@v4
  with:
    distribution: temurin
    java-version: 21

      - name: Create package.json
        run: |
          cat > package.json << 'EOF'
          {
            "name": "al-juman-lab",
            "version": "1.0.0",
            "private": true,
            "description": "Al-Juman Laboratory App",
            "scripts": {
              "build": "echo Web app ready"
            }
          }
          EOF

      - name: Install Capacitor
        run: |
          npm install @capacitor/core@7
          npm install --save-dev @capacitor/cli@7
          npm install @capacitor/android@7

      - name: Prepare web files
        run: |
          mkdir -p www/css
          mkdir -p www/js

          cp index.html www/index.html

          cp style.css www/css/style.css

          cp app.js www/js/app.js
          cp database.js www/js/database.js
          cp tests.js www/js/tests.js
          cp patients.js www/js/patients.js
          cp reports.js www/js/reports.js
          cp statistics.js www/js/statistics.js
          cp settings.js www/js/settings.js
          cp backup.js www/js/backup.js

          cp manifest.json www/ 2>/dev/null || true
          cp service-worker.js www/ 2>/dev/null || true

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.aljuman.lab",
            "appName": "Al-Juman Laboratory",
            "webDir": "www"
          }
          EOF

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Al-Juman-Laboratory-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
